<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>ادیار (Adyar) — مدیریت کمپین تبلیغات استوری</title>
    <!-- Self-hosted (not a CDN link) so the page never flashes a fallback
         font while waiting on a third-party font request. -->
    <link rel="preload" href="/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before paint, so there's no flash of the
      // wrong theme while React boots.
      try {
        var t = localStorage.getItem('theme')
        if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
