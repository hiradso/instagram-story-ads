name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock's dev-only deps (laravel/sail -> symfony/yaml)
          # need PHP >=8.4.1, even though production (which only ever runs
          # `composer install --no-dev`, excluding those) is on 8.3.
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, redis, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env for tests
        run: cp .env.example .env && php artisan key:generate

      - name: Run backend test suite
        run: php artisan test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://adyar.hiradso.ir/api
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Only the main repo's own pushes deploy — a fork's PR build never gets
    # anywhere near the SSH secrets, since needs.test still runs for those.
    if: github.repository == 'hiradso/instagram-story-ads' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build, and migrate on the server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            cd /home/adyar/adyar
            git pull --ff-only
            composer install --no-dev --optimize-autoloader --no-interaction
            cd frontend
            VITE_API_URL=https://adyar.hiradso.ir/api npm ci
            VITE_API_URL=https://adyar.hiradso.ir/api npm run build
            cd ..
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
          '
